spring.application.name=sentinel-backend
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/sentineldb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
sentinel.jwt.secret=${JWT_SECRET:SentinelLocalDemoSecretKeyChangeBeforeProduction2026}
sentinel.jwt.expiration-minutes=120
